name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # No dependencies needed: validators are dependency-free and run
      # node --check over every project JS file plus all structural checks.
      - name: Syntax + structural validation
        run: node scripts/validate_all.js

      # Optional: live read-only Supabase probes (publishable key only).
      # Keep on a schedule or manual dispatch to avoid noisy PR failures
      # while migrations are pending application.
      - name: Live read-only checks
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/validate_all.js --live