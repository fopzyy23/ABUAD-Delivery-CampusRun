# Netlify deployment configuration for Dropzyy
# Publish ONLY the assembled website directory (`dist/`), never the repo root.
# `node scripts/build_publish.js` copies an explicit allow-list of website files
# (assets/ + robots.txt + _redirects) into `dist/`; every other repository file
# (supabase/, scripts/, documentation, SQL backups, .netlify/) sits OUTSIDE the
# publish directory and is therefore never uploaded. `dist/` mirrors the old
# layout, so all URL paths below and every root-absolute URL in the HTML shells
# keep resolving exactly as before.
#
# ============================================================
# ROUTING — SINGLE SOURCE OF TRUTH
# ============================================================
# Netlify processes rules from `_redirects` BEFORE the rules in this file,
# so duplicating rules across the two files means one set silently shadows
# the other. `_redirects` is therefore intentionally comment-only now and
# every effective rule lives here.
#
# Semantics used below:
#   status = 200  a REWRITE. The URL in the address bar does not change and
#                 Netlify serves the target behind the scenes. No extra
#                 browser round trip, no query string lost, no history entry.
#   force         serve the target even if a real file exists at the path.
#                 Set ONLY on the leaf entry points (/ and the admin shells).
#                 It is deliberately NOT set on the /* fallback: forcing that
#                 would shadow every real file under /assets/**.
#
# IMPORTANT: a rewrite keeps the visitor's path, so asset URLs in the shells
# must be ROOT-ABSOLUTE (/assets/css/styles.css, /assets/js/app.js, ...).
# Relative URLs resolve against the rewritten path and 404 into the SPA
# fallback — this was the cause of unstyled/Supabase-less deep links.
# ============================================================

[build]
  publish = "dist"
  command = "node scripts/build_publish.js"

# 1. Root → the customer app shell.
#    A rewrite (not a redirect) is what stops "/" bouncing visitors to
#    /assets/html/index.html. It preserves ?reference=/?trxref= on the
#    Paystack return, keeps the visitor's URL, and avoids the extra history
#    entry that the old 0s meta-refresh produced (which made Back unusable).
[[redirects]]
  from = "/"
  to = "/assets/html/index.html"
  status = 200
  force = true

# 2. Admin entry points → the standalone admin panel shell.
[[redirects]]
  from = "/admin"
  to = "/assets/html/admin.html"
  status = 200
  force = true

[[redirects]]
  from = "/admin.html"
  to = "/assets/html/admin.html"
  status = 200
  force = true

[[redirects]]
  from = "/assets/admin.html"
  to = "/assets/html/admin.html"
  status = 200
  force = true

# 3. Real asset files win. Matched verbatim from the publish directory
#    (identity rewrite, so /assets/js/app.js is never shadowed by rule 4).
[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 200

# 4. SPA fallback for the customer app: any other path (/orders, /browse,
#    /rider, /checkout, ...) serves the shell. app.js maps the path onto its
#    hash route (applyPathRouteBootstrap) so deep links resolve instead of
#    falling back to the home route. Not forced — see the note above.
[[redirects]]
  from = "/*"
  to = "/assets/html/index.html"
  status = 200

# ============================================================
# Content Security Policy delivered as an HTTP response header.
#
# WHY A HEADER (not a <meta> tag): the `frame-ancestors` directive
# is silently ignored when delivered via <meta http-equiv> (per the
# CSP spec), so only an HTTP header actually enforces framing /
# clickjacking protection.
#
# This is the SINGLE authoritative CSP (the <meta> tags in
# assets/html/index.html and admin.html were removed to avoid a
# duplicate/secondary policy). It is the exact policy that lived in
# those <meta> tags, with ONE narrow, intentional addition:
# `img-src` now also permits images hosted on Dropzyy's OWN Supabase
# Storage origin (already trusted in connect-src) so legitimate
# product/vendor photos render.
#   * No new 'unsafe-inline' is added anywhere.
#   * https://www.google.com is NOT added to img-src — the broken
#     Google imgres images remain blocked by the browser.
# ============================================================
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://cmfohldnmytmwjynqfpz.supabase.co; connect-src 'self' https://cmfohldnmytmwjynqfpz.supabase.co wss://cmfohldnmytmwjynqfpz.supabase.co; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=(), payment=(), usb=()"
