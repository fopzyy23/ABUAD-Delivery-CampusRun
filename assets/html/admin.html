<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#FF2D6F" />
  <meta name="description" content="Dropzyy Admin Dashboard" />
    <title>Dropzyy · Admin</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛵</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/styles.css" />
  <link rel="stylesheet" href="/assets/css/admin.css" />
</head>
<body>
  <a class="skip-link" href="#app">Skip to content</a>

  <!-- ============ ADMIN HEADER ============ -->
  <header class="admin-header">
    <div class="container admin-header__inner">
      <a href="/" class="brand" aria-label="Dropzyy home">
        <span class="brand__logo">🛵</span>
        <span class="brand__text">Drop<span>zyy</span></span>
      </a>
      <div class="admin-header__actions">
        <span class="badge badge--brand">Admin Panel</span>
        <a href="/" class="btn btn--ghost btn--sm">← Back to Site</a>
        <button class="btn btn--dangerSoft btn--sm" id="adminLogoutBtn">Sign out</button>
      </div>
    </div>
  </header>

  <!-- ============ ADMIN MAIN CONTENT ============ -->
  <main id="app" class="admin-main" tabindex="-1"></main>

  <!-- ============ TOAST NOTIFICATIONS ============ -->
  <div id="toastRoot" class="toast-root" aria-live="polite"></div>

  <!-- ============ CONFIRMATION MODAL ============ -->
  <div id="modalRoot"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/assets/js/config.js"></script>
  <script src="/assets/js/modal.js" defer></script>
  <script src="/assets/js/admin.js" defer></script>
</body>
</html>
