<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f9d76" />
  <meta name="description" content="Dropzyy — anything you need around campus, delivered to you by another student." />
  <title>Dropzyy · Campus Delivery for Students</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛵</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/styles.css" />
  <link rel="stylesheet" href="../css/admin.css" />
</head>
<body>
  <!-- ============ TOP APP BAR ============ -->
  <header class="appbar" id="appbar">
    <div class="appbar__inner container">
      <a href="#/" class="brand" aria-label="Dropzyy home">
        <span class="brand__logo">🛵</span>
        <span class="brand__text">Drop<span>zyy</span></span>
      </a>

      <nav class="topnav" id="topnav" aria-label="Main navigation"></nav>

      <div class="appbar__actions">
        <button class="icon-btn" id="themeBtn" title="Toggle theme" aria-label="Toggle theme">🌙</button>

        <div class="dropdown" id="notifWrap">
          <button class="icon-btn" id="notifBtn" title="Notifications" aria-label="Notifications">
            🔔<span class="dot" id="notifDot" hidden></span>
          </button>
          <div class="dropdown__panel dropdown__panel--wide" id="notifPanel" hidden>
            <div class="dropdown__head">
              <strong>Notifications</strong>
              <button class="link-btn" id="notifClear">Mark all read</button>
            </div>
            <div id="notifList" class="notif-list"></div>
          </div>
        </div>

        <a href="#/cart" class="icon-btn" id="cartBtn" title="Cart" aria-label="Cart">
          🛒<span class="badge-count" id="cartCount" hidden>0</span>
        </a>

        <div class="dropdown" id="userWrap">
          <button class="avatar-btn" id="userBtn" aria-label="Account">
            <span id="userAvatar" class="avatar">👤</span>
          </button>
          <div class="dropdown__panel" id="userPanel" hidden></div>
        </div>
      </div>
    </div>
  </header>

  <!-- ============ ROUTED VIEW ============ -->
  <main id="app" class="app-main" tabindex="-1"></main>

  <!-- ============ FOOTER ============ -->
  <footer class="footer">
    <div class="container footer__inner">
      <div>
        <div class="brand brand--sm">
          <span class="brand__logo">🛵</span>
          <span class="brand__text">Drop<span>zyy</span></span>
        </div>
        <p class="muted">Anything you need around campus, delivered to you by another student.</p>
      </div>
      <div class="footer__links">
        <a href="#/vendors">Restaurants & Vendors</a>
        <a href="#/browse">Browse items</a>
        <a href="#/rider/apply">Become a rider</a>
        <a href="#/orders">My orders</a>
        <!-- Admin link shown only for admins (role check via JavaScript in app.js) -->
        <a href="#/admin" id="adminLink">Admin</a>
      </div>
    </div>
    <div class="container footer__base muted">
      <span>© <span id="year"></span> Dropzyy · Student-powered campus delivery</span>
      <span>Demo build · data stored locally in your browser</span>
    </div>
  </footer>

  <!-- ============ MOBILE BOTTOM NAV ============ -->
  <nav class="bottomnav" id="bottomnav" aria-label="Mobile navigation"></nav>

  <!-- ============ OVERLAYS ============ -->
  <div id="modalRoot"></div>
  <div id="toastRoot" class="toast-root" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/admin.js" defer></script>
  <script src="../js/app.js" defer></script>
</body>
</html>
